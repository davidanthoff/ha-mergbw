send_raw:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mergbw
    frame:
      required: true
      example: "5500ff05a5"
      selector:
        text:
    add_checksum:
      default: false
      selector:
        boolean:
    listen:
      default: 2
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
