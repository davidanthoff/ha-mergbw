[project]
name = "ha-mergbw"
version = "0.2.0"
description = "Home Assistant integration for MeRGBW Bluetooth sunset lamps"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "E501",    # line length is left to the formatter
    "RUF012",  # Home Assistant's mutable _attr_ class defaults
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
